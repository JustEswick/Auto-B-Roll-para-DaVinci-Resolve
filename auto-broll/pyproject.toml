[project]
name = "auto-broll"
version = "0.1.0"
description = "Automatización de B-Roll para DaVinci Resolve - Análisis semántico de audio para inserción automática de assets visuales"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Isaac", email = ""}
]
keywords = ["davinci-resolve", "video-editing", "automation", "b-roll", "speech-to-text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "PySide6>=6.6.0",
    "openai-whisper>=20231117",
    "spacy>=3.7.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "python-docx>=1.1.0",
    "pysrt>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
auto-broll = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
